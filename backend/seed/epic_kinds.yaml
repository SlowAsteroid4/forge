# epic_kinds.yaml — clasificación de contenedores de trabajo
#
# Aplicar con: make seed-epic-kinds  (idempotente, registra en audit_log)
#
# Valores válidos: normal | coordination | version_container
# - version_container : cajón de tareas sin épica de objetivo (YAP-66, YAP-130)
# - coordination      : tercero vivo — nunca cierra, flujo continuo de integración
# - normal            : épica con objetivo y fecha de cierre → va al forecast
#
# ⚠️ PENDIENTE DE CONFIRMACIÓN DEL PM:
# Las épicas [PLD], [CAY], [YAPI], [YPNX] son candidatas a 'coordination' (terceros / regulatorios).
# Descomenta y ajusta epic_kind una vez confirmadas. Están como 'normal' por defecto.

epics:
  # ── Version Containers (100% confirmados) ──────────────────────────
